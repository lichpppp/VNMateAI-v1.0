name: tests

# Chạy toàn bộ bộ test (pytest + test Node .mjs) trên mỗi lần push / PR.
# Windows vì requirements có gói chỉ chạy trên Windows (pywin32, pywinauto, wmi).
# Test gọi dịch vụ ngoài thật (marker `network`) bị bỏ qua theo pytest.ini.
# Bộ test tự cô lập: DB tạm (VNMATEAI_DB_PATH), Telegram tắt
# (VNMATEAI_TELEGRAM_OUTBOUND=off), sao lưu/khôi phục config — xem tests/conftest.py.

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Trang admin (Next.js, xuất tĩnh ra admin/out) — server phục vụ /admin/*
      # từ đó và test topology (phase88) gọi thật các trang này.
      - name: Build trang admin
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Tạo config.json từ mẫu (không có bí mật)
        shell: bash
        run: test -f config.json || cp config.example.json config.json

      - name: Chạy test
        run: python -m pytest -q
